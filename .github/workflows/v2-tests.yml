name: V2 offline tests
on:
  push:
    branches: [main, feature/enterprise-agent]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v2.txt
      - run: python -m pytest -q tests_v2
        env:
          DEMO_MODE: 'true'
          APP_DATA_DIR: './.local_data_ci'
          APP_API_TOKEN: unit-test-secret
