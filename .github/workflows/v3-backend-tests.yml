name: V3 backend tests

on:
  push:
    branches: [main, feature/enterprise-agent, feature/enterprise-rag-v3]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: enterprise_rag_test
          MYSQL_USER: rag_user
          MYSQL_PASSWORD: rag_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-v3.txt
      - name: Run offline and database/cache integration tests
        run: python -m pytest -q tests_v2 tests_v3 tests_integration
        env:
          DEMO_MODE: "true"
          APP_API_TOKEN: unit-test-secret
          TEST_DATABASE_URL: mysql+pymysql://rag_user:rag_password@127.0.0.1:3306/enterprise_rag_test?charset=utf8mb4
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
